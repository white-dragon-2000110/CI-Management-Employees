<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Test - Desktop & Mobile</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .test-container {
            min-height: 100vh;
            padding: 40px 0;
        }
        .test-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }
        .test-header {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .test-body {
            padding: 40px;
        }
        .camera-container {
            text-align: center;
            margin-bottom: 30px;
        }
        #video {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            border: 3px solid #3498db;
            margin-bottom: 20px;
        }
        #canvas {
            display: none;
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            border: 3px solid #27ae60;
            margin-bottom: 20px;
        }
        .btn-camera {
            background: linear-gradient(135deg, #27ae60, #229954);
            border: none;
            border-radius: 10px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            margin: 5px;
            transition: all 0.3s ease;
        }
        .btn-camera:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }
        .btn-camera:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }
        .status-display {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
        }
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .device-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .device-info h6 {
            color: #495057;
            margin-bottom: 15px;
        }
        .device-info p {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .device-info .badge {
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="test-card">
                        <div class="test-header">
                            <h1><i class="fas fa-camera me-3"></i>Camera Test</h1>
                            <p class="mb-0">Testing camera functionality on desktop and mobile</p>
                        </div>
                        
                        <div class="test-body">
                            <!-- Device Information -->
                            <div class="device-info">
                                <h6><i class="fas fa-info-circle me-2"></i>Device Information</h6>
                                <div id="deviceInfo"></div>
                            </div>

                            <!-- Camera Feed -->
                            <div class="camera-container">
                                <video id="video" autoplay playsinline muted></video>
                                <canvas id="canvas"></canvas>
                                
                                <div class="mt-3">
                                    <button id="startCamera" class="btn-camera">
                                        <i class="fas fa-camera me-2"></i>Start Camera
                                    </button>
                                    <button id="capturePhoto" class="btn-camera" disabled>
                                        <i class="fas fa-camera-retro me-2"></i>Capture Photo
                                    </button>
                                    <button id="switchCamera" class="btn-camera" disabled>
                                        <i class="fas fa-sync-alt me-2"></i>Switch Camera
                                    </button>
                                    <button id="stopCamera" class="btn-camera" disabled>
                                        <i class="fas fa-stop me-2"></i>Stop Camera
                                    </button>
                                </div>
                            </div>

                            <!-- Status Display -->
                            <div id="statusDisplay" class="status-display" style="display: none;"></div>

                            <!-- Photo Preview -->
                            <div id="photoPreview" class="text-center" style="display: none;">
                                <h6 class="mb-3">Captured Photo</h6>
                                <img id="previewImage" class="img-fluid rounded" style="max-width: 300px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Camera Utilities -->
    <script src="application/views/templates/camera-utils.js"></script>
    
    <script>
        let cameraManager = null;
        let capturedImage = null;

        // Display device information
        function displayDeviceInfo() {
            const deviceInfo = document.getElementById('deviceInfo');
            const info = {
                userAgent: navigator.userAgent,
                isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),
                isSecure: location.protocol === 'https:' || 
                         location.hostname === 'localhost' || 
                         location.hostname === '127.0.0.1' ||
                         location.hostname === '10.254.254.16',
                protocol: location.protocol,
                hostname: location.hostname,
                cameraSupported: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
            };

            deviceInfo.innerHTML = `
                <p><strong>User Agent:</strong> <span class="badge bg-secondary">${info.userAgent.substring(0, 50)}...</span></p>
                <p><strong>Device Type:</strong> <span class="badge ${info.isMobile ? 'bg-warning' : 'bg-info'}">${info.isMobile ? 'Mobile' : 'Desktop'}</span></p>
                <p><strong>Protocol:</strong> <span class="badge ${info.isSecure ? 'bg-success' : 'bg-danger'}">${info.protocol}</span></p>
                <p><strong>Hostname:</strong> <span class="badge bg-secondary">${info.hostname}</span></p>
                <p><strong>Secure Context:</strong> <span class="badge ${info.isSecure ? 'bg-success' : 'bg-danger'}">${info.isSecure ? 'Yes' : 'No'}</span></p>
                <p><strong>Camera API:</strong> <span class="badge ${info.cameraSupported ? 'bg-success' : 'bg-danger'}">${info.cameraSupported ? 'Supported' : 'Not Supported'}</span></p>
            `;
        }

        // Show status message
        function showStatus(message, type = 'info') {
            const statusDisplay = document.getElementById('statusDisplay');
            statusDisplay.textContent = message;
            statusDisplay.className = `status-display status-${type}`;
            statusDisplay.style.display = 'block';
        }

        // Hide status message
        function hideStatus() {
            document.getElementById('statusDisplay').style.display = 'none';
        }

        // Initialize camera
        async function startCamera() {
            try {
                hideStatus();
                
                const video = document.getElementById('video');
                const canvas = document.getElementById('canvas');
                
                cameraManager = createCameraManager({
                    onError: (message) => {
                        showStatus(message, 'error');
                        updateButtonStates(false);
                    },
                    onSuccess: () => {
                        showStatus('Camera started successfully!', 'success');
                        updateButtonStates(true);
                    },
                    onStreamReady: (stream) => {
                        console.log('Camera stream ready:', stream);
                    }
                });

                await cameraManager.initialize(video, canvas);
                
            } catch (error) {
                console.error('Camera initialization error:', error);
                showStatus('Failed to start camera: ' + error.message, 'error');
            }
        }

        // Capture photo
        function capturePhoto() {
            try {
                if (!cameraManager || !cameraManager.isActive()) {
                    showStatus('Camera not ready', 'error');
                    return;
                }

                capturedImage = cameraManager.capturePhoto(0.8);
                
                // Show preview
                const previewImage = document.getElementById('previewImage');
                previewImage.src = capturedImage;
                document.getElementById('photoPreview').style.display = 'block';
                
                showStatus('Photo captured successfully!', 'success');
                
            } catch (error) {
                console.error('Photo capture error:', error);
                showStatus('Failed to capture photo: ' + error.message, 'error');
            }
        }

        // Switch camera
        async function switchCamera() {
            try {
                if (!cameraManager || !cameraManager.isActive()) {
                    showStatus('Camera not ready', 'error');
                    return;
                }

                showStatus('Switching camera...', 'info');
                await cameraManager.switchCamera();
                showStatus('Camera switched successfully!', 'success');
                
            } catch (error) {
                console.error('Camera switch error:', error);
                showStatus('Failed to switch camera: ' + error.message, 'error');
            }
        }

        // Stop camera
        function stopCamera() {
            if (cameraManager) {
                cameraManager.stop();
                cameraManager = null;
                
                // Reset video element
                const video = document.getElementById('video');
                video.srcObject = null;
                
                // Hide photo preview
                document.getElementById('photoPreview').style.display = 'none';
                
                updateButtonStates(false);
                showStatus('Camera stopped', 'info');
            }
        }

        // Update button states
        function updateButtonStates(cameraActive) {
            document.getElementById('startCamera').disabled = cameraActive;
            document.getElementById('capturePhoto').disabled = !cameraActive;
            document.getElementById('switchCamera').disabled = !cameraActive;
            document.getElementById('stopCamera').disabled = !cameraActive;
        }

        // Event listeners
        document.getElementById('startCamera').addEventListener('click', startCamera);
        document.getElementById('capturePhoto').addEventListener('click', capturePhoto);
        document.getElementById('switchCamera').addEventListener('click', switchCamera);
        document.getElementById('stopCamera').addEventListener('click', stopCamera);

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            displayDeviceInfo();
            
            // Check if camera is supported
            if (!isCameraSupported()) {
                showStatus('Camera API not supported in this browser', 'error');
                document.getElementById('startCamera').disabled = true;
            }
            
            // Check security context
            if (!isSecureContext()) {
                showStatus('Warning: Camera access may not work on mobile devices without HTTPS', 'warning');
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (cameraManager) {
                cameraManager.stop();
            }
        });
    </script>
</body>
</html>
